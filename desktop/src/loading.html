<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<title>TV Pro</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #0b0e14; color: #e7ebf3;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .logo { width: 72px; height: 72px; animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(.96); } }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid rgba(255,255,255,.18); border-top-color: #0057FF; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .label { font-size: 14px; opacity: .75; }
  .label b { font-weight: 600; opacity: 1; }
</style>
</head>
<body>
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <rect x="1" y="3.5" width="30" height="21" rx="7" fill="#0057FF"/>
    <path d="M13.2 9.6v8.8a1 1 0 0 0 1.53.85l6.9-4.4a1 1 0 0 0 0-1.7l-6.9-4.4a1 1 0 0 0-1.53.85z" fill="#fff"/>
    <rect x="9.5" y="26.6" width="13" height="2.6" rx="1.3" fill="#0057FF"/>
  </svg>
  <div class="spinner" role="status" aria-label="Loading"></div>
  <div class="label"><b>TV Pro</b> — جارٍ التحميل… / Loading…</div>
</body>
</html>
