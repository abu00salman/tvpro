<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TV Pro — فحص القنوات</title>
<style>
  :root { --bg:#080A0D; --panel:#12161c; --line:#232a33; --text:#e8ecf1; --muted:#8b95a3; --ok:#3ecf8e; --bad:#ff6b6b; --warn:#f5b041; --accent:#3d8bfd; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, "SF Pro Text", "Segoe UI", Tahoma, sans-serif; padding:16px; padding-bottom:48px; }
  h1 { font-size:20px; margin:4px 0 4px; }
  p.lead { color:var(--muted); margin:0 0 16px; }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  input { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-size:16px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .card h3 { margin:0 0 6px; font-size:15px; display:flex; justify-content:space-between; gap:8px; align-items:center; }
  .host { direction:ltr; unicode-bidi:plaintext; color:var(--muted); font-size:12px; word-break:break-all; }
  .step { font-size:13px; margin:4px 0; display:flex; gap:6px; }
  .step b { min-width:18px; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .warn { color:var(--warn); } .muted { color:var(--muted); }
  pre { direction:ltr; text-align:left; white-space:pre-wrap; word-break:break-all; background:#0b0e12; border-radius:8px; padding:8px; font-size:11px; margin:6px 0 0; max-height:140px; overflow:auto; }
  video { width:100%; border-radius:8px; background:#000; margin-top:8px; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid currentColor; white-space:nowrap; }
  #report { width:100%; min-height:120px; background:#0b0e12; color:var(--muted); border:1px solid var(--line); border-radius:10px; font:11px/1.4 ui-monospace, Menlo, monospace; direction:ltr; padding:8px; }
</style>
</head>
<body>
<h1>فحص القنوات</h1>
<p class="lead">يجرّب القناة عبر كل بوابة ويبيّن أين يتوقف التشغيل. بيانات اشتراكك تُقرأ من هذا الجهاز فقط، وتُخفى من النتائج.</p>

<div class="row">
  <input id="q" placeholder="رقم القناة أو اسمها، مثل 353" value="353" inputmode="search">
  <button id="go">افحص</button>
</div>
<div id="status" class="muted"></div>
<div id="results"></div>
<div id="reportWrap" style="display:none">
  <p class="muted">صوّر هذه الصفحة أو انسخ التقرير وأرسله:</p>
  <textarea id="report" readonly></textarea>
  <div class="row"><button id="copy" class="ghost">نسخ التقرير</button></div>
</div>

<script>
(() => {
  const GATEWAYS = ['https://great-fox-5853.abu00salmanr.deno.net', 'https://tvpro-gateway.rmz.deno.net', 'https://gateway.tv-pro.app', 'https://tvpro-gateway.abu00salman-r.workers.dev'];
  const $ = (id) => document.getElementById(id);
  let secrets = [];
  const redact = (s) => { let out = String(s); for (const x of secrets) if (x && x.length > 1) out = out.split(x).join('***').split(encodeURIComponent(x)).join('***'); return out; };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open('tvpro', 1); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onupgradeneeded = () => { r.transaction.abort(); rej(new Error('no-data')); }; });
  }
  function get(db, store, key) {
    return new Promise((res, rej) => { const r = db.transaction(store, 'readonly').objectStore(store)[key === undefined ? 'getAll' : 'get'](key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function loadLibrary() {
    const db = await idb();
    const activeId = await get(db, 'kv', 'activePlaylist');
    const playlists = await get(db, 'playlists');
    const pl = playlists.find((p) => p.id === activeId) || playlists[0];
    if (!pl) throw new Error('no-playlist');
    const lib = await get(db, 'libraries', pl.id);
    let secret;
    if (pl.secret) {
      const key = await get(db, 'kv', 'vault:key');
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: pl.secret.iv }, key, pl.secret.data);
      secret = JSON.parse(new TextDecoder().decode(plain));
    }
    return { pl, lib, secret };
  }
  function serverOrigin(s) { const t = s.trim(); try { return new URL(/^[a-z][a-z0-9+.-]*:\/\//i.test(t) ? t : 'http://' + t).origin; } catch { return t.replace(/\/+$/, ''); } }
  function channelUrl(ch, secret) {
    if (ch.url) { const m = /^(https?:\/\/[^/]+\/(?:live\/)?[^/]+\/[^/]+\/\d+)\.ts(\?.*)?$/i.exec(ch.url); return m ? m[1] + '.m3u8' + (m[2] || '') : ch.url; }
    if (ch.xt && secret && secret.type === 'xtream') return serverOrigin(secret.server) + '/' + ch.xt.kind + '/' + encodeURIComponent(secret.username) + '/' + encodeURIComponent(secret.password) + '/' + ch.xt.id + '.' + ch.xt.ext;
    return null;
  }
  const via = (gw, url) => { const u = new URL(gw.replace(/\/?$/, '/proxy')); u.searchParams.set('url', url); return u.toString(); };

  async function timed(url, opts = {}, ms = 12000) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms); const t0 = performance.now();
    try { const r = await fetch(url, { ...opts, signal: ctl.signal, cache: 'no-store' }); return { r, ms: Math.round(performance.now() - t0) }; }
    catch (e) { return { err: e.name === 'AbortError' ? 'timeout ' + ms / 1000 + 's' : (e.message || String(e)), ms: Math.round(performance.now() - t0) }; }
    finally { clearTimeout(t); }
  }
  function firstUri(text, base) {
    for (const line of text.split(/\r?\n/)) { const s = line.trim(); if (s && !s.startsWith('#')) { try { return new URL(s, base).toString(); } catch { return null; } } }
    return null;
  }

  async function testRoute(name, playlistUrl, card, log) {
    const step = (icon, cls, text, detail) => {
      const d = document.createElement('div'); d.className = 'step';
      d.innerHTML = '<b class="' + cls + '">' + icon + '</b><span>' + esc(text) + (detail ? '<pre>' + esc(redact(detail)) + '</pre>' : '') + '</span>';
      card.querySelector('.steps').appendChild(d);
      log.push('  ' + icon + ' ' + text + (detail ? '\n     ' + redact(detail).slice(0, 300).replace(/\n/g, '\n     ') : ''));
    };
    const badge = (cls, text) => { const b = card.querySelector('.badge'); b.className = 'badge ' + cls; b.textContent = text; log[0] += '  => ' + text; };

    let res = await timed(playlistUrl);
    if (res.err) { step('✗', 'bad', 'القائمة: لا اتصال (' + res.err + ')'); return badge('bad', 'فشل'); }
    let r = res.r, body = await r.text().catch(() => '');
    const info = (resp, ms) => 'HTTP ' + resp.status + ' · ' + (resp.headers.get('content-type') || '-') + ' · ' + ms + 'ms' + (resp.headers.get('x-tvpro-error') ? ' · ' + resp.headers.get('x-tvpro-error') : '');
    if (!r.ok || !body.trimStart().startsWith('#EXTM3U')) { step('✗', 'bad', 'القائمة: ' + info(r, res.ms), body.slice(0, 300)); return badge('bad', 'فشل'); }
    step('✓', 'ok', 'القائمة: ' + info(r, res.ms), body.slice(0, 220));
    let base = playlistUrl;
    if (body.includes('#EXT-X-STREAM-INF')) {
      const v = firstUri(body, base);
      res = await timed(v);
      if (res.err) { step('✗', 'bad', 'قائمة الجودة: لا اتصال (' + res.err + ')'); return badge('bad', 'فشل'); }
      body = await res.r.text().catch(() => '');
      if (!res.r.ok || !body.includes('#EXTINF')) { step('✗', 'bad', 'قائمة الجودة: ' + info(res.r, res.ms), body.slice(0, 300)); return badge('bad', 'فشل'); }
      step('✓', 'ok', 'قائمة الجودة: ' + info(res.r, res.ms), body.slice(0, 160));
      base = v;
    }
    const seg = firstUri(body, base);
    if (!seg) { step('✗', 'bad', 'لا يوجد مقطع فيديو في القائمة'); return badge('bad', 'فشل'); }
    if (location.protocol === 'https:' && seg.startsWith('http:')) { step('✗', 'bad', 'المقطع برابط http فيحجبه المتصفح (Mixed Content)', seg); return badge('bad', 'فشل'); }
    res = await timed(seg, { headers: { Range: 'bytes=0-4095' } });
    if (res.err) { step('✗', 'bad', 'مقطع الفيديو: لا اتصال (' + res.err + ')'); return badge('bad', 'فشل'); }
    const buf = new Uint8Array(await res.r.arrayBuffer().catch(() => new ArrayBuffer(0)));
    const ts = buf[0] === 0x47, mp4 = buf.length > 8 && String.fromCharCode(...buf.slice(4, 8)).match(/ftyp|styp|moof/);
    if (!res.r.ok || !buf.length) { step('✗', 'bad', 'مقطع الفيديو: ' + info(res.r, res.ms), new TextDecoder().decode(buf.slice(0, 200))); return badge('bad', 'فشل'); }
    step(ts || mp4 ? '✓' : '!', ts || mp4 ? 'ok' : 'warn', 'مقطع الفيديو: ' + info(res.r, res.ms) + ' · ' + buf.length + ' bytes' + (ts ? ' · MPEG-TS' : mp4 ? ' · MP4' : ' · صيغة غير معروفة'), ts || mp4 ? '' : new TextDecoder().decode(buf.slice(0, 160)));
    badge(ts || mp4 ? 'ok' : 'warn', ts || mp4 ? 'يعمل' : 'مشكوك');

    const btn = document.createElement('button'); btn.className = 'ghost'; btn.textContent = 'جرّب التشغيل هنا'; btn.style.marginTop = '8px';
    btn.onclick = () => {
      btn.remove();
      const v = document.createElement('video'); v.controls = true; v.playsInline = true; v.muted = true; v.autoplay = true; v.src = playlistUrl;
      const note = document.createElement('div'); note.className = 'step muted'; note.textContent = 'جارٍ التشغيل…';
      v.addEventListener('playing', () => { note.className = 'step ok'; note.textContent = '✓ الفيديو يعمل عبر هذه البوابة'; log.push('  ✓ ' + name + ': native playback OK'); });
      v.addEventListener('error', () => { const e = v.error; note.className = 'step bad'; note.textContent = '✗ خطأ تشغيل MediaError ' + (e && e.code) + ' ' + ((e && e.message) || ''); log.push('  ✗ ' + name + ': MediaError ' + (e && e.code) + ' ' + ((e && e.message) || '')); renderReport(); });
      card.appendChild(v); card.appendChild(note);
    };
    card.appendChild(btn);
  }

  async function accountInfo(secret, log) {
    if (!secret || secret.type !== 'xtream') return;
    const api = serverOrigin(secret.server) + '/player_api.php?username=' + encodeURIComponent(secret.username) + '&password=' + encodeURIComponent(secret.password);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<h3><span>حالة الاشتراك</span><span class="badge muted">…</span></h3><div class="steps"></div>';
    $('results').appendChild(card);
    const set = (cls, text, html) => { const b = card.querySelector('.badge'); b.className = 'badge ' + cls; b.textContent = text; card.querySelector('.steps').innerHTML = html; };
    for (const gw of GATEWAYS) {
      const res = await timed(via(gw, api), {}, 10000);
      if (res.err || !res.r.ok) continue;
      let j; try { j = await res.r.json(); } catch { continue; }
      const u = (j && j.user_info) || {};
      const exp = u.exp_date ? new Date(Number(u.exp_date) * 1000).toLocaleDateString('ar') : 'غير محدد';
      const active = Number(u.active_cons || 0), max = Number(u.max_connections || 0);
      const fmts = Array.isArray(u.allowed_output_formats) ? u.allowed_output_formats.join(', ') : '-';
      const ok = u.auth == 1 && String(u.status).toLowerCase() === 'active';
      const full = max > 0 && active >= max;
      set(ok && !full ? 'ok' : 'bad', ok ? (full ? 'الاتصالات ممتلئة' : 'فعّال') : 'غير فعّال',
        '<div class="step">الحالة: <b>' + esc(u.status || '-') + '</b></div>' +
        '<div class="step">ينتهي في: <b>' + esc(exp) + '</b></div>' +
        '<div class="step ' + (full ? 'bad' : '') + '">الاتصالات المستخدمة الآن: <b>' + active + ' من ' + (max || '?') + '</b></div>' +
        '<div class="step">الصيغ المسموحة: <b dir="ltr">' + esc(fmts) + '</b></div>' +
        (full ? '<div class="step bad">كل الاتصالات مستخدمة، فالسيرفر يرفض أي تشغيل جديد للقنوات. أغلق التطبيقات والأجهزة الأخرى التي تستخدم نفس الاشتراك وانتظر دقيقة.</div>' : ''));
      log.push('[account] status=' + u.status + ' auth=' + u.auth + ' exp=' + exp + ' connections=' + active + '/' + max + ' formats=' + fmts, '');
      return;
    }
    set('warn', 'تعذّر', '<div class="step muted">تعذّر قراءة حالة الاشتراك من السيرفر.</div>');
    log.push('[account] unavailable', '');
  }

  let lastLog = [];
  function renderReport() { $('report').value = lastLog.join('\n'); $('reportWrap').style.display = ''; }

  async function run() {
    $('go').disabled = true; $('results').innerHTML = ''; $('status').textContent = 'جارٍ قراءة القائمة من هذا الجهاز…';
    try {
      const { pl, lib, secret } = await loadLibrary();
      secrets = secret ? [secret.username, secret.password, secret.url].filter(Boolean) : [];
      const q = $('q').value.trim().toLowerCase();
      const chans = (lib && lib.channels) || [];
      const ch = chans.find((c) => String(c.number) === q) || chans.find((c) => (c.name || '').toLowerCase() === q) || chans.find((c) => (c.name || '').toLowerCase().includes(q));
      if (!ch) { $('status').textContent = 'لم أجد قناة بهذا الرقم أو الاسم.'; return; }
      const src = channelUrl(ch, secret);
      if (!src) { $('status').textContent = 'تعذّر تكوين رابط القناة.'; return; }
      const srcUrl = new URL(src);
      $('status').innerHTML = 'القناة: <b>' + esc(ch.number + ' · ' + ch.name) + '</b><br><span class="host">' + esc(redact(src)) + '</span>';
      lastLog = ['TV Pro diag ' + new Date().toISOString(), 'UA: ' + navigator.userAgent, 'Channel: ' + ch.number + ' ' + ch.name, 'Source: ' + redact(src) + '  (port ' + (srcUrl.port || 'default') + ')', ''];
      let custom = null; try { custom = JSON.parse(localStorage.getItem('tvpro:settings') || '{}').proxyUrl || null; } catch {}
      const routes = [['مباشر (بدون بوابة)', src], ...[custom, ...GATEWAYS].filter((g, i, a) => g && a.indexOf(g) === i).map((g) => [g.replace(/^https:\/\//, ''), via(g, src)])];
      await accountInfo(secret, lastLog);
      for (const [name, url] of routes) {
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<h3><span class="host">' + esc(name) + '</span><span class="badge muted">…</span></h3><div class="steps"></div>';
        $('results').appendChild(card);
        const log = ['[' + name + ']'];
        if (name.startsWith('مباشر') && location.protocol === 'https:' && src.startsWith('http:')) {
          log[0] += '  => skipped (http source on https page)';
          card.querySelector('.badge').textContent = 'غير ممكن'; card.querySelector('.steps').innerHTML = '<div class="step muted">المصدر http والموقع https، فالمتصفح يمنع الاتصال المباشر. هذا طبيعي.</div>';
        } else {
          try { await testRoute(name, url, card, log); } catch (e) { log.push('  ✗ ' + (e.message || e)); }
        }
        lastLog.push(...log, '');
      }
      $('status').innerHTML += '<br><span class="muted">انتهى الفحص.</span>';
      renderReport();
    } catch (e) {
      $('status').textContent = e.message === 'no-data' || e.message === 'no-playlist' ? 'لا توجد قائمة محفوظة على هذا الجهاز. افتح هذه الصفحة من نفس المتصفح الذي تستخدم فيه TV Pro.' : 'خطأ: ' + (e.message || e);
    } finally { $('go').disabled = false; }
  }
  $('go').onclick = run;
  $('q').addEventListener('keydown', (e) => { if (e.key === 'Enter') run(); });
  $('copy').onclick = async () => { try { await navigator.clipboard.writeText($('report').value); $('copy').textContent = 'تم النسخ ✓'; } catch { $('report').select(); } };
})();
</script>
</body>
</html>
