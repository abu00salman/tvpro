name: Build and release apps (Windows, macOS, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'app-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist/out
          cp dist/*.exe dist/out/TV-Pro-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-windows
          path: desktop/dist/out/TV-Pro-windows.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG + zip
        run: npm run dist:mac

      - name: Rename artifacts
        run: |
          mkdir -p dist/out
          cp dist/*.dmg dist/out/TV-Pro-macos.dmg
          cp dist/*.zip dist/out/TV-Pro-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-macOS
          path: |
            desktop/dist/out/TV-Pro-macos.dmg
            desktop/dist/out/TV-Pro-macos.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tvpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -dname "CN=TV Pro, OU=TV Pro, O=TV Pro, L=, ST=, C="

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          RELEASE_STORE_FILE: ../release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
          RELEASE_KEY_ALIAS: tvpro
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/TV-Pro-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-android
          path: mobile/android/app/build/outputs/apk/release/TV-Pro-android.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project (installs CocoaPods pods)
        run: npx cap sync ios

      - name: Build unsigned .app (no code signing / no Apple account)
        working-directory: mobile/ios/App
        run: |
          set -euxo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned .ipa
        working-directory: mobile/ios/App
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -r -y TV-Pro-ios-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-ios
          path: mobile/ios/App/TV-Pro-ios-unsigned.ipa
          if-no-files-found: error

  create-release:
    needs: [build-windows, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: TV Pro — iPhone · Android · Mac · Windows
          body: |
            📺 TV Pro — حمّل الآن واستمتع

            📺 TV Pro — Download now and enjoy

            التطبيق متوفر للجميع: آيفون، أندرويد، ماك وويندوز.
            Available for everyone: iPhone, Android, Mac and Windows.

            | المنصة / Platform | الملف / File |
            |---|---|
            | 📱 Android | TV-Pro-android.apk |
            | 🍎 iPhone / iPad | TV-Pro-ios-unsigned.ipa * |
            | 💻 Mac (Intel + Apple Silicon, universal) | TV-Pro-macos.dmg |
            | 🪟 Windows | TV-Pro-windows.exe |

            👇 حمّل ملف منصتك من قسم Assets أدناه / Pick your platform's file from Assets below.

            \* ملاحظة: تطبيق الآيفون غير موقّع (unsigned) لعدم توفر حساب Apple Developer. لتثبيته تحتاج توقيعه بحسابك الخاص (مثلاً عبر AltStore / Sideloadly / Xcode) أو عبر أي شخص يملك شهادة توقيع. بديل فوري بدون توقيع: افتح tv-pro.app في Safari واختر "إضافة إلى الشاشة الرئيسية" لتثبيته كتطبيق ويب.
            \* Note: the iPhone app is unsigned because no Apple Developer account is configured. To install it you need to sign it yourself (e.g. via AltStore / Sideloadly / Xcode) or have someone with a signing certificate sign it for you. Immediate no-signing alternative: open tv-pro.app in Safari and choose "Add to Home Screen" to install it as a web app.
          files: |
            artifacts/TV-Pro-windows/*.exe
            artifacts/TV-Pro-macOS/*.dmg
            artifacts/TV-Pro-macOS/*.zip
            artifacts/TV-Pro-android/*.apk
            artifacts/TV-Pro-ios/*.ipa
          fail_on_unmatched_files: true
