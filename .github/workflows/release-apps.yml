name: Build and release apps (Windows, macOS, Android)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'app-v*'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG + zip
        run: npm run dist:mac

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-macOS
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tvpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -dname "CN=TV Pro, OU=TV Pro, O=TV Pro, L=, ST=, C="

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          RELEASE_STORE_FILE: ../release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
          RELEASE_KEY_ALIAS: tvpro
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/TV-Pro-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-android
          path: mobile/android/app/build/outputs/apk/release/TV-Pro-android.apk
          if-no-files-found: error

  create-release:
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: TV Pro v${{ steps.ver.outputs.version }}
          body: |
            تطبيقات TV Pro لكل المنصات:

            - **Android**: ملف APK — فعّل "تثبيت من مصادر غير معروفة" ثم ثبّت الملف.
            - **Windows**: برنامج تثبيت (.exe).
            - **macOS**: ملف DMG (يدعم Intel وApple Silicon - universal).
            - **iPhone/iPad**: لا يوجد حساب مطوّر آبل مفعّل حالياً، فلا يمكن توفير IPA قابل للتثبيت المباشر. افتح tv-pro.app في Safari واستخدم "إضافة إلى الشاشة الرئيسية" لتثبيت التطبيق كـ PWA.
          files: |
            artifacts/TV-Pro-windows/*.exe
            artifacts/TV-Pro-macOS/*.dmg
            artifacts/TV-Pro-macOS/*.zip
            artifacts/TV-Pro-android/*.apk
          fail_on_unmatched_files: true
