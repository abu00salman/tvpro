name: Build and release apps (Windows, macOS, Android, iOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Rename installer
        shell: bash
        run: |
          mkdir -p dist/out
          cp dist/*.exe dist/out/TV-Pro-windows.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-windows
          path: desktop/dist/out/TV-Pro-windows.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build universal DMG + zip
        run: npm run dist:mac

      - name: Rename artifacts
        run: |
          mkdir -p dist/out
          cp dist/*.dmg dist/out/TV-Pro-macos.dmg
          cp dist/*.zip dist/out/TV-Pro-macos.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-macOS
          path: |
            desktop/dist/out/TV-Pro-macos.dmg
            desktop/dist/out/TV-Pro-macos.zip
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Generate a signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias tvpro \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -keypass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}" \
            -dname "CN=TV Pro, OU=TV Pro, O=TV Pro, L=, ST=, C="
          echo "RELEASE_STORE_FILE=$(pwd)/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
          RELEASE_KEY_ALIAS: tvpro
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'tvpro-release' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/TV-Pro-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-android
          path: mobile/android/app/build/outputs/apk/release/TV-Pro-android.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor iOS project (installs CocoaPods pods)
        run: npx cap sync ios

      - name: Build unsigned .app (no code signing / no Apple account)
        working-directory: mobile/ios/App
        run: |
          set -euxo pipefail
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package unsigned .ipa
        working-directory: mobile/ios/App
        run: |
          set -euxo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -r -y TV-Pro-ios-unsigned.ipa Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-ios
          path: mobile/ios/App/TV-Pro-ios-unsigned.ipa
          if-no-files-found: error

  build-tizen:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Tizen Studio CLI (web CLI + certificate tools)
        run: |
          set -euxo pipefail
          TIZEN_STUDIO_VERSION=5.5
          curl -fsSL -o web-cli.bin "http://download.tizen.org/sdk/Installer/tizen-studio_${TIZEN_STUDIO_VERSION}/web-cli_Tizen_Studio_${TIZEN_STUDIO_VERSION}_ubuntu-64.bin"
          chmod +x web-cli.bin
          echo y | ./web-cli.bin --accept-license "$HOME/tizen-studio"
          echo "$HOME/tizen-studio/tools/ide/bin" >> "$GITHUB_PATH"

      - name: Create a self-signed author + distributor security profile
        run: |
          set -euxo pipefail
          export PATH="$HOME/tizen-studio/tools/ide/bin:$PATH"
          PASS="tvpro-tizen"
          mkdir -p "$HOME/tizen-studio-data/keystore/author"
          # Generate the author cert with OpenSSL directly (legacy PKCS12 encryption),
          # since Tizen's own "tizen certificate" CLI produces a PKCS12 file that this
          # Tizen Studio version's packaging step then rejects with "Invalid password"
          # on Ubuntu 24.04's newer OpenSSL (default PKCS12 encryption is too new for it).
          openssl genrsa -out /tmp/tvpro-author.key 2048
          openssl req -new -x509 -key /tmp/tvpro-author.key -out /tmp/tvpro-author.crt -days 10000 \
            -subj "/C=US/ST=CA/L=San Francisco/O=TV Pro/CN=TV Pro"
          openssl pkcs12 -export -legacy \
            -in /tmp/tvpro-author.crt -inkey /tmp/tvpro-author.key \
            -out "$HOME/tizen-studio-data/keystore/author/tvpro-author.p12" \
            -name TVPro -passout "pass:$PASS"
          DISTRIBUTOR_P12="$HOME/tizen-studio/tools/certificate-generator/certificates/distributor/tizen-distributor-signer.p12"
          tizen security-profiles add -n tvpro \
            -a "$HOME/tizen-studio-data/keystore/author/tvpro-author.p12" -p "$PASS" \
            -d "$DISTRIBUTOR_P12" -dp "tizenpkcs12passfordsigner"

      - name: Build and package the signed .wgt
        run: |
          set -euxo pipefail
          export PATH="$HOME/tizen-studio/tools/ide/bin:$PATH"
          tizen build-web -- "$GITHUB_WORKSPACE/tizen"
          tizen package -t wgt -s tvpro -- "$GITHUB_WORKSPACE/tizen/.buildResult" || {
            echo "---- tizen package failed, dumping cli.log ----"
            find "$HOME" -name 'cli.log' -exec cat {} \;
            exit 1
          }
          mkdir -p out
          find "$GITHUB_WORKSPACE/tizen/.buildResult" -maxdepth 1 -name '*.wgt' -exec cp {} out/TV-Pro-samsung-tv.wgt \;

      - name: Upload Tizen artifact
        uses: actions/upload-artifact@v4
        with:
          name: TV-Pro-tizen
          path: out/TV-Pro-samsung-tv.wgt
          if-no-files-found: ignore

  create-release:
    needs: [build-windows, build-macos, build-android, build-ios, build-tizen]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#app-v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build list of assets that actually exist
        id: assets
        run: |
          set -euo pipefail
          files=""
          for f in artifacts/TV-Pro-windows/*.exe artifacts/TV-Pro-macOS/*.dmg artifacts/TV-Pro-macOS/*.zip artifacts/TV-Pro-android/*.apk artifacts/TV-Pro-ios/*.ipa artifacts/TV-Pro-tizen/*.wgt; do
            if [ -f "$f" ]; then
              files="$files"$'\n'"$f"
            fi
          done
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: TV Pro — iPhone · Android · Mac · Windows · Samsung TV
          body: |
            📺 TV Pro — حمّل الآن واستمتع

            📺 TV Pro — Download now and enjoy

            التطبيق متوفر للجميع: آيفون، أندرويد، ماك، ويندوز، وتلفزيونات سامسونج.
            Available for everyone: iPhone, Android, Mac, Windows and Samsung TVs.

            | المنصة / Platform | الملف / File |
            |---|---|
            | 📱 Android | TV-Pro-android.apk |
            | 🍎 iPhone / iPad | TV-Pro-ios-unsigned.ipa * |
            | 💻 Mac (Intel + Apple Silicon, universal) | TV-Pro-macos.dmg |
            | 🪟 Windows | TV-Pro-windows.exe |
            | 📺 Samsung Smart TV (Tizen) | TV-Pro-samsung-tv.wgt ** |

            👇 حمّل ملف منصتك من قسم Assets أدناه / Pick your platform's file from Assets below.

            \* ملاحظة: تطبيق الآيفون غير موقّع (unsigned) لعدم توفر حساب Apple Developer. لتثبيته تحتاج توقيعه بحسابك الخاص (مثلاً عبر AltStore / Sideloadly / Xcode) أو عبر أي شخص يملك شهادة توقيع. بديل فوري بدون توقيع: افتح tv-pro.app في Safari واختر "إضافة إلى الشاشة الرئيسية" لتثبيته كتطبيق ويب.
            \* Note: the iPhone app is unsigned because no Apple Developer account is configured. To install it you need to sign it yourself (e.g. via AltStore / Sideloadly / Xcode) or have someone with a signing certificate sign it for you. Immediate no-signing alternative: open tv-pro.app in Safari and choose "Add to Home Screen" to install it as a web app.

            \** تثبيت تطبيق Samsung TV: فعّل وضع المطور (Developer Mode) على التلفزيون من Apps > ابحث عن رقم طراز جهازك، ثم ثبّت الملف عبر Tizen Studio/SDB من جهاز كمبيوتر على نفس الشبكة. التوقيع هنا محلي (للتطوير فقط)، وليس من متجر Samsung.
            \** Installing the Samsung TV app: enable Developer Mode on the TV (Apps > search your model number), then install the file via Tizen Studio/SDB from a computer on the same network. The signature here is a local development signature, not a Samsung Store one.
          files: ${{ steps.assets.outputs.files }}
          fail_on_unmatched_files: true
