<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TV Pro — Movies</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="tvx-header">
  <a href="index.html" class="tvx-logo"><span class="dot"></span>TV Pro</a>
  <nav class="tvx-nav">
    <a href="index.html" data-nav-link="index.html" data-i18n="nav.home">Home</a>
    <a href="live.html" data-nav-link="live.html" data-i18n="nav.live">Live TV</a>
    <a href="movies.html" data-nav-link="movies.html" data-i18n="nav.movies">Movies</a>
    <a href="series.html" data-nav-link="series.html" data-i18n="nav.series">Series</a>
    <a href="anime.html" data-nav-link="anime.html" data-i18n="nav.anime">Anime</a>
  </nav>
  <div class="tvx-header-actions">
    <label class="tvx-search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="quickSearch" data-i18n-placeholder="search.placeholder" placeholder="Search…">
    </label>
    <button class="icon-btn" id="langToggle" aria-label="Language">EN</button>
    <button class="icon-btn" id="themeToggle" aria-label="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <h1 data-i18n="nav.movies">Movies</h1>
  <div class="filter-bar" id="filterBar"></div>
  <div id="grid" class="grid-posters"></div>
  <div id="emptyState" class="empty-state" style="display:none"><span data-i18n="search.empty">No results</span></div>
</main>

<nav class="tvx-tabbar">
  <div class="tvx-tabs">
    <a href="index.html" data-nav-link="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav.home">Home</span></a>
    <a href="live.html" data-nav-link="live.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg><span data-i18n="nav.live">Live</span></a>
    <a href="search.html" data-nav-link="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span data-i18n="nav.search">Search</span></a>
    <a href="movies.html" data-nav-link="movies.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg><span data-i18n="nav.movies">Movies</span></a>
  </div>
</nav>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/gateway.js"></script>
<script src="js/demo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="js/rows.js"></script>
<script src="js/app.js"></script>
<script src="js/listing.js"></script>
<script>
  TvproListing.initListing('movies', 'nav.movies');
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('quickSearch').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.trim()) location.href = 'search.html?q=' + encodeURIComponent(e.target.value.trim());
    });
  });
</script>
</body>
</html>
