<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>TV Pro</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="tvx-header">
  <a href="index.html" class="tvx-logo"><span class="dot"></span>TV Pro</a>
  <nav class="tvx-nav">
    <a href="index.html" data-nav-link="index.html" data-i18n="nav.home">Home</a>
    <a href="live.html" data-nav-link="live.html" data-i18n="nav.live">Live TV</a>
    <a href="movies.html" data-nav-link="movies.html" data-i18n="nav.movies">Movies</a>
    <a href="series.html" data-nav-link="series.html" data-i18n="nav.series">Series</a>
    <a href="anime.html" data-nav-link="anime.html" data-i18n="nav.anime">Anime</a>
    <a href="guide.html" data-nav-link="guide.html" data-i18n="nav.guide">Guide</a>
  </nav>
  <div class="tvx-header-actions">
    <label class="tvx-search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="search" id="quickSearch" data-i18n-placeholder="search.placeholder" placeholder="Search…">
    </label>
    <button class="icon-btn" id="langToggle" aria-label="Language">EN</button>
    <button class="icon-btn" id="themeToggle" aria-label="Theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="heroSlider" class="hero-slider" aria-roledescription="carousel"></div>
  <div id="rows"></div>
</main>

<nav class="tvx-tabbar">
  <div class="tvx-tabs">
    <a href="index.html" data-nav-link="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i18n="nav.home">Home</span></a>
    <a href="live.html" data-nav-link="live.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8"/></svg><span data-i18n="nav.live">Live</span></a>
    <a href="search.html" data-nav-link="search.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span data-i18n="nav.search">Search</span></a>
    <a href="movies.html" data-nav-link="movies.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg><span data-i18n="nav.movies">Movies</span></a>
  </div>
</nav>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/gateway.js"></script>
<script src="js/demo.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script src="js/rows.js"></script>
<script src="js/hero.js"></script>
<script src="js/app.js"></script>
<script>
(async function () {
  const library = await TvproApp.getLibrary();
  TvproApp.renderDemoBanner(document.getElementById('main'), library.source);

  const open = (item) => TvproApp.openItem(item, library);
  const play = (item) => TvproApp.openPlayer(item, library);

  const heroItems = library.source === 'demo'
    ? TvproDemo.heroItems()
    : [...library.movies.slice(0, 4), ...library.series.slice(0, 3)];
  TvproHero.createHeroSlider(document.getElementById('heroSlider'), heroItems, play, open);

  const rowsEl = document.getElementById('rows');
  const liveNow = library.channels.filter((c) => c.live !== false).slice(0, 12);

  // Continue watching: real history entries resolved back to real items, newest first.
  // Demo library has no history (nothing is ever written for demo data), so this row simply
  // doesn't render there — it is never filled with placeholder "continue watching" items.
  const historyEntries = Object.values(library.history || {}).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const continueItems = historyEntries
    .map((h) => TvproApp.resolveItem(library, h.kind, h.itemId))
    .filter(Boolean)
    .slice(0, 14);

  const favoriteEntries = Object.values(library.favorites || {}).sort((a, b) => (b.addedAt || 0) - (a.addedAt || 0));
  const favoriteItems = favoriteEntries
    .map((f) => { const id = f.key.slice(2); return TvproApp.resolveItem(library, f.kind, id); })
    .filter(Boolean)
    .slice(0, 14);

  TvproRows.row(rowsEl, 'home.continue', continueItems, open, { wide: true });
  TvproRows.row(rowsEl, 'home.live_now', liveNow, open, { wide: true });
  TvproRows.row(rowsEl, 'nav.favorites', favoriteItems, open);
  TvproRows.row(rowsEl, 'home.recent_added', [...library.movies].slice(0, 14), open);
  TvproRows.row(rowsEl, 'nav.series', [...library.series].slice(0, 14), open);
  if (library.anime && library.anime.length) TvproRows.row(rowsEl, 'nav.anime', library.anime.slice(0, 14), open);

  document.getElementById('quickSearch').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.value.trim()) location.href = 'search.html?q=' + encodeURIComponent(e.target.value.trim());
  });
})();
</script>
</body>
</html>
